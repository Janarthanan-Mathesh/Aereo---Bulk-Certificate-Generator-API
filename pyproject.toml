[project]
name = "bulk-certificate-generator-api"
version = "2.0.0"
description = "A FastAPI service for creating and tracking bulk certificate generation jobs."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "reportlab>=4.2,<5.0",
  "sqlalchemy>=2.0,<3.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0,<9.0", "httpx>=0.27,<1.0"]

[tool.ruff]
line-length = 100
target-version = "py312"
